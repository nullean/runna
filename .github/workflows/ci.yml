name: ci

# nuget.org's trusted publishing policies name this file, so releasing happens here too: publishing the
# release-drafter draft (web UI or phone) fires `release: published`, and the release job below runs on it.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `mise run ci`: test, pack, validate, diff the public API. macOS runners are scarce:
  # pull requests run on Linux, main adds macOS. A release runs no tests of its own; its main-green gate requires
  # main's full run, macOS included, to have passed on the released commit.
  build:
    if: github.event_name != 'release'
    uses: nullean/.github/.github/workflows/dotnet-ci.yml@e21d5f59405aa7078e51825cd4c407191e28562f # v1.6.1
    permissions:
      contents: read
    with:
      os: >-
        ${{ github.event_name == 'push'
          && '["ubuntu-latest", "macos-latest"]'
          || '["ubuntu-latest"]' }}
      packages-path: build/output

  zizmor:
    uses: nullean/.github/.github/workflows/zizmor.yml@e21d5f59405aa7078e51825cd4c407191e28562f # v1.6.1
    permissions:
      contents: read


  # The docs build as gh-pages.yml publishes it, without publishing, so a PR proves the build and post-build steps.
  docs:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build documentation
        uses: elastic/docs-builder@f7bda51872e0f64dcc3e3a65fb6a59f02b7a3365 # 1.72.0
        env:
          FEATURE_NAVIGATION_PREVIEW: true

      - name: Theme and landing page
        run: scripts/docs-finish.sh .artifacts/docs/html

  # every push to main publishes a canary build to GitHub Packages
  canary:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Push to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          until dotnet nuget push 'packages/*.nupkg' -k "$GITHUB_TOKEN" \
            -s https://nuget.pkg.github.com/nullean/index.json --skip-duplicate --no-symbols; do
            echo "Retrying"; sleep 1
          done

  # publishing the release-drafter draft releases: the shared workflow first waits for main's ci.yml run on the tagged
  # commit and stops unless it passed (its main-green job; the test jobs above do not run on a release), then packs at
  # the tag's version...
  release:
    if: github.event_name == 'release'
    needs: zizmor
    uses: nullean/.github/.github/workflows/release.yml@e21d5f59405aa7078e51825cd4c407191e28562f # v1.6.1
    permissions:
      actions: read # the main-green gate reads main's runs
      contents: write
    with:
      packages-path: build/output

  # ...and this file publishes: nuget.org's trusted publishing checks that the token's workflow is this ci.yml, which a
  # job inside the shared workflow is not. It then appends the public API reports to the release notes.
  publish:
    if: github.event_name == 'release'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # append the public API changes to the release notes
      id-token: write # NuGet trusted publishing: exchange the OIDC token for a short-lived key
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: packages
      - uses: nullean/.github/actions/nuget-publish@e21d5f59405aa7078e51825cd4c407191e28562f # v1.6.1
        with:
          user: ${{ secrets.NUGET_USER }}
          packages-path: packages
